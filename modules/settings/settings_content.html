<h1>Settings Panel</h1>
<p>Configure your application settings here.</p>
<div>
    <label for="theme-select">Theme:</label>
    <select id="theme-select">
        <option value="light">Light</option>
        <option value="dark">Dark</option>
    </select>
</div>
<input type="text" id="api-key-input" placeholder="Enter API Key" style="margin-top: 10px; width: 200px;" />
<button id="save-settings-btn" style="margin-top: 10px;">Save Settings</button>
<div id="settings-feedback" style="margin-top: 10px;"></div>
