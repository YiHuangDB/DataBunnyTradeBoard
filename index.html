<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Two-Column Layout</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="left-navigator">
        <h2>Modules</h2>
        <input type="text" id="nav-search" placeholder="Search modules...">
        <ul id="nav-list">
            <!-- Navigator items will be loaded here -->
        </ul>
    </div>
    <div id="content-area">
        <button id="toggle-nav-btn">Hide Nav</button>
        <button id="toggle-fullscreen-btn">Fullscreen</button> <!-- New button -->
        <div id="module-content-wrapper">
            <!-- Module HTML content will be loaded here -->
        </div>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
